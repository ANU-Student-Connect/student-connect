name: Deploy student connect pages

on:
  workflow_dispatch:
  push:
    branches:
      - question

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Nodejs
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Install frontend Dependencies
      - name: Install frontend Dependencies
        run: cd student-connect/client && npm install

      # Build the frontend project
      - name: Build frontend project
        run: cd student-connect/client && npm run build

      # Navigate to the backend directory
      - name: Navigate to backend directory
        run: cd student-connect/server

      # Install backend Dependencies
      - name: Install backend Dependencies
        run: npm install

      # Start the backend server
      - name: Start backend server
        run: node app.js

      # Deploy frontend to github pages
      - name: Deploy to github pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: student-connect/client/dist 